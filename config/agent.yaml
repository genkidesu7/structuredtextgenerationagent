# Agent Manifest — AgentRegistry entry point
# AgentRegistry reads every key below at ROOT level — do NOT nest keys under an
# `agent:` block. Runtime tunables live in config/config.yaml.
id: "CMN-C1-517"
name: "StructuredTextGenerationAgent"
namespace: "cmn"
version: "0.1.0"
enabled: true
category: "Cat 1"
generation_mode: "llm"  # deterministic | llm
industry: "CMN"
description: "Provider-agnostic structured text generation with schema validation and automatic retry"

# Opaque compatibility metadata. It is not an inheritance selector or gate input.
base_type: "AgentBaseGraph"

# Entry point — single dotted import path (module.Class).
class: "src.graph.graph.StructuredTextGenerationAgent"

# Security
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates — every ctx.secrets.require("KEY") call must be listed.
requires:
  secrets:
    - "AZURE_OPENAI_API_KEY"
    - "AZURE_OPENAI_ENDPOINT"
    - "AZURE_OPENAI_DEPLOYMENT"
  extras: ["openai"]
